name: Validation

# Au passage en Ready d'une PR, et seulement là (#150) : `ready_for_review`, ou une PR ouverte ou
# rouverte hors brouillon. Sur `pull_request_target`, GitHub lit ce workflow sur `main`, jamais dans
# la PR : la garde qui juge est celle de `main` (#159). À part de `ci.yml`, qui tourne sur
# `pull_request`, pour qu'aucune des deux exécutions ne montre sautés les jobs de l'autre (#150, B1).
#
# Place de chaque job sur le second axe des harnais, ce qu'ils lisent (#113) :
# - `validation` lit des fichiers suivis : ceux du commit de la PR, par git, sans les extraire, et la
#   section « Invariants et contraintes » de l'issue que la PR ferme, lue par l'API. Rien de la PR ne
#   s'installe ni ne s'exécute, et ses permissions sont en lecture seule : c'est ce qui rend sûr
#   `pull_request_target`. Seul job de ce workflow : l'étiquette de l'issue a le sien (`etiquette.yml`).

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

# Un passage en Ready rend caduc celui d'avant, sur la même PR.
concurrency:
  group: validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Extrait `main`, jamais la PR, et ne lance que la garde : elle lit par git le commit de la PR
  # (registre, documents, fichiers modifiés) et, par `gh`, la section de l'issue citée par
  # « Close #n ». Une PR qui change la garde ou ce workflow ne change donc pas le verdict rendu sur
  # elle-même. Aucun secret : le jeton du job, en lecture, sert à git et à `gh`.
  validation:
    name: Validation
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sans case à cocher : le passage en Ready est la validation du porteur (#150). Quand la garde
      # ne sait pas lire ce que la PR propose, ou que la PR ne ferme pas une issue, le job est rouge et
      # le dit.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node packages/gardes/cli.mjs pr --base ${{ github.event.pull_request.base.sha }} --tete ${{ github.event.pull_request.head.sha }} --pr ${{ github.event.pull_request.number }}
