name: Vérifications manuelles

# Garde de l'objectif primaire #58 (D61) : la description de la PR déclare les invariants et les
# contraintes qu'elle touche, et chaque vérification manuelle qui s'y rattache y est analysée puis
# validée par un développeur humain. Cocher « Validée » l'enregistre ; un commit qui modifie le
# code, ou un changement de branche cible, l'annule et décoche la case ; documentation et harnais,
# non (#61). Tourne aussi quand la description change, sans rejouer tests ni build.
#
# Place de chaque job sur le second axe des harnais, ce qu'ils lisent (#113, D71) :
# - `verifications` lit hors des fichiers suivis : la description de la PR, ses analyses et ses cases
#   sont un jugement humain qui ne vit que sur GitHub (`cli.mjs pr --github`).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

# Écrire : enregistrer une validation en commentaire, décocher une validation annulée.
permissions:
  contents: read
  issues: write
  pull-requests: write

# Aucun groupe de concurrence : chaque modification de la description doit être lue, sinon une case
# cochée pendant qu'une autre vérification tourne ne serait jamais enregistrée.

jobs:
  verifications:
    name: Vérifications manuelles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # la base, pour lister les fichiers modifiés et relire l'ancien registre
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Description, cases cochées avant et après, tête et branche cible : tout vient du fichier
      # d'événement de GitHub, jamais du script.
      - name: Invariants et contraintes de la PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/gardes/cli.mjs pr --github
