name: Amorçages

# Les amorçages (#82, D63) jugent le travail du codeur sur une règle du projet : ils constatent
# une livraison, ils ne gardent pas un comportement. Ils restent donc hors de `pnpm test` et des
# crochets, mais tournent sur chaque PR, en mode strict, et à la demande (#122, D74).
#
# Place de chaque job sur le second axe des harnais, ce qu'ils lisent (#113, D71) :
# - `amorcage` lit des fichiers suivis : il rejoue ici `pnpm amorcage`, tel qu'en local.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  amorcage:
    name: Amorçages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # les amorçages comparent la PR à sa base et copient le dépôt
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm amorcage
        env:
          TIRELIRE_STRICT: '1'
