name: Amorçages

# Les amorçages (#82, D63) jugent le travail du codeur sur une règle du projet : ils constatent
# une livraison, ils ne gardent pas un comportement. Ils restent donc hors de `pnpm test` et des
# crochets, et ne tournent que sur une PR qui touche aux règles, ou à la demande.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'amorcage/**'
      - 'packages/gardes/**'
      - 'docs/gardes.md'
      - 'docs/invariants.md'
      - 'docs/contraintes.md'
      - 'docs/decisions.md'
      - 'docs/description-projet.md'
      - 'CLAUDE.md'
      - '.github/workflows/**'
      - '.github/pull_request_template.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  amorcage:
    name: Amorçages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # les amorçages comparent la PR à sa base et copient le dépôt
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm amorcage
        env:
          TIRELIRE_STRICT: '1'
