name: CI et livraison

# Sur une PR, rien ne tourne en brouillon ; tout tourne au passage en Ready, une fois par passage
# (#150). Sept workflows, pour qu'aucune exécution ne montre sautés les jobs qu'une autre joue (B1,
# sauf `depot-apercu.yml`) : celui-ci (tests, assemblage de l'aperçu, livraison), `validation.yml` (la
# garde de `main`), `apercu.yml` (attente de toute la CI au Ready, retrait de l'aperçu) et
# `depot-apercu.yml` (dépôt de l'aperçu quand le porteur coche sa case, #175), lus sur `main`,
# `pret.yml` et `suivi.yml` (les repères
# d'une PR prête, et le signalement d'un changement après le Ready, #168) et `fin.yml` (« en cours »
# quitte l'issue fermée).
#
# Les identifiants FTP (`OVH_FTP_*`) : dépôt public, dans l'environnement `depot-ftp`, qui n'admet
# que `main` (#155) ; dépôt privé sur l'offre gratuite, au niveau du dépôt, lisibles par tout workflow
# d'une branche, risque accepté (#176, `docs/hebergement-web.md`). Les lisent ici `recette`, sur
# `main`, et `production`, au tag `v*`.
#
# Où se dépose le site (#233, D83) : un push sur `main` dépose `main` à la racine de la recette, la
# version de développement ; seule la publication d'une version, par son tag `v*`, dépose en
# production, après les tests au seuil 3. Le lancement manuel, sur `main`, redépose la recette ; il ne
# touche jamais la production.
#
# La version forcée (#274) : `version-forcee.yml`, déclenché à la main par le porteur, appelle ce
# workflow (`workflow_call`, `version_forcee: true`) sur le dernier commit de `main`. Elle se joue
# comme un tag poussé à la main — seuil 3, tests navigateur compris, rien ne se saute — et le job
# `etiquette` ne pose son tag qu'après : le dépôt en production, l'APK et la release l'attendent. Son nom
# (`packages/gardes/version-forcee.mjs`) : le dernier numéro de version publié, un tiret, le hash
# court du commit. Un tag posé avec le jeton du job ne déclenche aucun workflow : rien ne se rejoue.
#
# Place de chaque job sur le second axe des harnais, ce qu'ils lisent (#113) :
# - `test` lit des fichiers suivis : il rejoue ici typecheck, `pnpm test` et build, tels qu'en local ;
#   l'archive du site qu'il dépose ensuite ne juge rien. Ses seuils (#232, D83) : au Ready et sur
#   `main`, seuil 1, et, sur une PR, le harnais du besoin et les tests navigateur de l'issue en entier
#   (`tests-de-l-issue.sh`, #307) ; au tag `v*` et pour une version forcée, seuil 3, tests navigateur
#   activés, avant de publier. Les tests navigateur de non-régression ne s'y jouent ni au Ready ni
#   après la fusion : chaque nuit, sur `main` (`nuit.yml`, #307). Le moins cher d'abord (#264) :
#   typecheck, seuil 1, harnais du besoin, puis les tests navigateur de l'issue, qui ne partent que si
#   tout le reste est vert. Il ne joue que le manque (#237, #266) : au Ready, une
#   branche qui ne contient pas le dernier `main` est à mettre à jour et rien d'autre ne se joue ;
#   sinon, ce qui se saute suit D83 (« Les empreintes », « L'attestation »), seuil 1 compris : la
#   décision passe par `pnpm test --attestation <fichier>`, que prépare `.githooks/attestation.mjs`,
#   et le lanceur dit les fichiers qu'il joue et ceux qu'il saute. Il lit l'API (statuts, PR d'un
#   commit) en lecture seule.
# - `hebergement` est hors harnais : il assemble le site pour la racine, sans rien vérifier, sur
#   `main` et à la main (la racine de la recette, `/`), à un tag `v*` (la production,
#   `vars.TIRELIRE_BASE`) ; jamais sur une PR, où `assemblage-apercu` l'assemble (#153).
# - `recette` lit hors des fichiers suivis : après le dépôt de `main` à la racine de la recette,
#   l'étape « Vérifier la racine de la recette en ligne » (`verifier.sh`) lit le site déployé.
# - `etiquette` est hors harnais : il pose le tag d'une version forcée, sans rien vérifier.
# - `production` lit hors des fichiers suivis : après le dépôt d'une version publiée, l'étape
#   « Vérifier le site en ligne » (`verifier.sh`) lit le site déployé.
# - `android` est hors harnais : il construit l'APK, sans rien vérifier ; s'il échoue, il dit dans le
#   résumé de l'exécution que la release sort sans APK (#289).
# - `publication` est hors harnais : il publie la release du tag avec `tirelire-hebergement.zip`. Il
#   n'attend que le site assemblé et le tag posé, jamais l'APK (#289). Quand le porteur crée la release à
#   la main dans GitHub, ce qui pose le tag, l'exécution du tag met cette release à jour au lieu d'en
#   créer une autre.
# - `apk-de-la-release` est hors harnais : il joint l'APK à la release, quand `android` l'a construit
#   (#289).
# - `assemblage-apercu` est hors harnais : il assemble le site de la PR pour son sous-dossier de
#   recette — le seul assemblage d'une PR, sans réglage de recette ni identifiant, pour que le site
#   se construise toujours (I9, #153) — et le passe en artefact (`apercu-pr-<numéro>`) au job de
#   dépôt de `depot-apercu.yml`, qui n'exécute rien de la PR (#155).

on:
  push:
    branches: [main]
    tags: ['v*']
  # Le passage en Ready : `ready_for_review`, ou une PR ouverte ou rouverte hors brouillon (#150). Un
  # commit sur une PR prête ne rejoue rien ici : l'architecte la repasse en brouillon puis en Ready
  # (#401), ce que `suivi.yml` rappelle en commentaire, avec le statut « Toute la CI sur ce commit » en échec
  # (#168). Le retrait
  # de l'aperçu, à la fermeture, est dans `apercu.yml` (#155).
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      deploiement:
        description: "Dépôt FTP de main à la racine de la recette (jamais en production)"
        type: choice
        options: [automatique, essai-a-blanc, ignorer]
        default: automatique
  # La version forcée (#274) : seul `version-forcee.yml` l'appelle, sans autre saisie.
  workflow_call:
    inputs:
      version_forcee:
        description: "Publier une version forcée du dernier commit de main"
        type: boolean
        default: false

permissions:
  contents: write

# Sur une PR, un passage en Ready rend caduc celui d'avant ; un push sur `main` ou un tag ne
# s'annule pas.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests et build web
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # la PR d'un commit arrivé sur `main` (#237)
      statuses: read # « Toute la CI sur ce commit » de sa tête (#237)
    outputs:
      version_forcee: ${{ steps.version_forcee.outputs.nom }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Toute l'histoire : le harnais du besoin se lit depuis la base commune avec `main` (#232),
          # et la tête de la PR doit contenir le dernier `main` (#237) ; les tags aussi, pour le nom
          # d'une version forcée (#274).
          fetch-depth: 0
      # Une version forcée (#274), avant tout test : son nom, et rien ne se joue si le déclenchement
      # ne vise pas `main` ou si le commit porte déjà une version. Aucun tag ne se pose ici.
      - name: Version forcée, son nom
        id: version_forcee
        if: inputs.version_forcee
        run: node packages/gardes/version-forcee.mjs nom
      # Au Ready (#237, #266) : une branche qui ne contient pas le dernier `main` est à mettre à jour,
      # et rien d'autre ne se joue ; sinon, les empreintes vertes de chaque ensemble — attestation de
      # la branche, têtes de la branche vertes au Ready, `main`. `$RUNNER_TEMP/attestation.json` : ce
      # qui se saute, que les étapes de tests passent à `pnpm test`.
      - name: Branche à jour, et empreintes vertes
        if: github.event_name == 'pull_request'
        env:
          TETE: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node .githooks/attestation.mjs ready "$TETE" "$GITHUB_HEAD_REF" origin/main "$RUNNER_TEMP/attestation.json" "$GITHUB_STEP_SUMMARY" --depot "$GITHUB_REPOSITORY"
      # Sur `main` (#237, #266) : chaque ensemble dont l'empreinte est celle d'une tête de PR verte au
      # Ready, ou du premier parent, se saute.
      - name: Empreintes vertes après la fusion
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v') && !inputs.version_forcee
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .githooks/attestation.mjs apres-fusion "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/attestation.json" "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le moins cher d'abord (#264) : le typecheck avant les tests.
      - name: Typecheck
        id: typecheck
        run: pnpm typecheck
      # Outils des tests : sans eux, un test se saute en local. En CI, `TIRELIRE_STRICT` les rend
      # obligatoires, pour qu'un test muet ne passe pas pour vert (D54, #59) : navigateur des gardes
      # d'interface, PHP du relais, lftp et pyftpdlib du dépôt FTP. L'image GitHub fournit Chrome et
      # PHP ; le reste s'installe.
      - name: Outils des tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp python3-pyftpdlib
          command -v php > /dev/null || sudo apt-get install -y -qq php-cli
          php -v | head -n 1
          lftp --version | head -n 1
          python3 -c 'import pyftpdlib; print("pyftpdlib présent")'
      # Seuils (#232, D83) : au Ready et sur `main`, les tests de niveau 0 et 1 — l'auditeur a
      # vérifié au seuil 2 avant le Ready, la livraison aussi, hors tests navigateur sauf demande —,
      # hors tests navigateur, que seule l'option `--navigateur` active ; puis, sur une PR, le harnais
      # du besoin, puis les tests navigateur de l'issue, qui ne partent que si tout le reste est vert
      # (#264). La non-régression dans le navigateur se joue la nuit, sur `main` (#307).
      # `--attestation` (#237, #266, #302) : le lanceur saute, fichier par fichier, ce dont l'empreinte
      # est déjà trouvée verte à un seuil au moins égal, et dit ce qu'il joue et ce qu'il saute ; sans
      # fichier, tout se joue. Aucun moment ne fait exception, le seuil 1 du Ready non plus (#266,
      # point 4).
      - name: Tests au seuil 1, sauf empreinte verte
        id: seuil1
        if: "!startsWith(github.ref, 'refs/tags/v') && !inputs.version_forcee"
        run: pnpm test 1 --attestation "$RUNNER_TEMP/attestation.json"
        env:
          TIRELIRE_STRICT: '1'
      # Le harnais du besoin en cours, en entier (seuil 4), par sa définition commune (D83) ; sauté
      # si son empreinte est déjà trouvée verte (#237, #266).
      - name: Harnais du besoin, en entier
        id: harnais
        if: github.event_name == 'pull_request'
        run: sh .githooks/harnais-du-besoin.sh --jouer --attestation "$RUNNER_TEMP/attestation.json" --branche "$GITHUB_HEAD_REF"
        env:
          TIRELIRE_STRICT: '1'
      # Les tests navigateur de l'issue (#307) : les fichiers de tests navigateur que la PR ajoute ou
      # modifie, hors harnais du besoin, en entier (seuil 4), sauf chaque fichier vert sur son
      # empreinte, par leur définition commune avec la livraison.
      - name: Tests navigateur de l'issue, en entier
        id: navigateur
        if: github.event_name == 'pull_request'
        run: sh .githooks/tests-de-l-issue.sh --jouer --attestation "$RUNNER_TEMP/attestation.json" --branche "$GITHUB_HEAD_REF"
        env:
          TIRELIRE_STRICT: '1'
      # Avant de publier une version, poussée à la main ou forcée (#274) : les tests jusqu'au niveau 3,
      # le dégradé compris, tests navigateur activés (D87), le moins cher d'abord : les tests
      # navigateur ne partent que si le reste est vert (#264). Rien ne se saute (#266, point 4 ; #302) :
      # sans fichier d'empreintes, sur une tête détachée ou sur `main`, le lanceur ne lit aucune
      # attestation. `--complet` : le lanceur dit tout, fichier par fichier (D83 ; #352, point 9).
      - name: Tests au seuil 3, avant de publier
        id: seuil3
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee
        run: pnpm test 3 --complet
        env:
          TIRELIRE_STRICT: '1'
      - name: Tests navigateur au seuil 3, avant de publier
        id: navigateur3
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee
        run: pnpm --dir apps/web run test 3 --navigateur test/navigateur --complet
        env:
          TIRELIRE_STRICT: '1'
      # Ce que ce passage a joué, étape par étape (#264, point 9 ; #266, point 7) ; ce qui s'est sauté,
      # ensemble par ensemble, et pourquoi — par qui l'empreinte a été trouvée verte, sur quel commit,
      # à quel seuil —, est dit plus haut dans le résumé, et par le lanceur, fichier par fichier
      # (#302), dans le journal de chaque étape.
      - name: Ce que ce passage a joué
        if: always()
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          SEUIL1: ${{ steps.seuil1.outcome }}
          HARNAIS: ${{ steps.harnais.outcome }}
          NAVIGATEUR: ${{ steps.navigateur.outcome }}
          SEUIL3: ${{ steps.seuil3.outcome }}
          NAVIGATEUR3: ${{ steps.navigateur3.outcome }}
        run: |
          dit() {
            case $1 in
              success) echo "vert$2" ;;
              failure) echo "rouge" ;;
              skipped | '') echo "non joué : un palier moins cher a rougi, ou ce moment ne le joue pas" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "### Ce que ce passage a joué"
            echo
            echo "- typecheck : $(dit "$TYPECHECK")"
            if [ "$TAG" = true ]; then
              echo "- au tag, rien ne se saute (aucune empreinte verte n'y est lue) : seuil 3 en entier, sur chaque ensemble : $(dit "$SEUIL3") ; tests navigateur au seuil 3 : $(dit "$NAVIGATEUR3")"
            else
              echo "- seuil 1 — garde, cœur, relais, hébergement, interface sans navigateur : $(dit "$SEUIL1" ", chaque ensemble joué ou sauté sur une empreinte verte (voir plus haut)")"
              [ "$GITHUB_EVENT_NAME" = pull_request ] && echo "- harnais du besoin, en entier : $(dit "$HARNAIS" ", joué ou sauté sur une empreinte verte (voir plus haut)")"
              [ "$GITHUB_EVENT_NAME" = pull_request ] && echo "- tests navigateur de l'issue, en entier : $(dit "$NAVIGATEUR" ", chaque fichier joué ou sauté sur une empreinte verte (voir le journal de l'étape)")"
              echo "- tests navigateur de non-régression : non joués ici — ils se jouent la nuit, sur main (nuit.yml)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build
        env:
          # Le nom d'une version forcée, que la référence construite (`main`) ne porte pas : la version
          # que l'application affiche (#142). Vide ailleurs : la construction lit sa référence.
          TIRELIRE_VERSION: ${{ steps.version_forcee.outputs.nom }}
      - name: Archiver le site (à déposer tel quel sur un serveur privé)
        uses: actions/upload-artifact@v4
        with:
          name: tirelire-web
          path: apps/web/dist
          retention-days: 30

  hebergement:
    name: Site pour hébergement mutualisé
    needs: test
    # Pour la racine, à déposer et publier : sur `main` et à la main, la racine de la recette, qui est
    # celle d'un sous-domaine (#233) ; à un tag `v*`, la production. Sur une PR, le site ne s'assemble
    # qu'une fois, dans `assemblage-apercu`, pour son sous-dossier de recette (#153).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assembler (PWA + relais PHP + .htaccess + .ovhconfig)
        env:
          # Sous-dossier où le site sera installé (« / » par défaut = racine du domaine ou sous-domaine) :
          # celui de la production à un tag `v*` et pour une version forcée (#274), la racine de la
          # recette sinon (#233).
          TIRELIRE_BASE: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee) && (vars.TIRELIRE_BASE || '/') || '/' }}
          # Le nom d'une version forcée, que l'application affiche (#142) ; vide ailleurs.
          TIRELIRE_VERSION: ${{ needs.test.outputs.version_forcee }}
        run: pnpm --filter @tirelire/hebergement assembler
      - uses: actions/upload-artifact@v4
        with:
          name: tirelire-hebergement
          path: apps/hebergement/tirelire-hebergement.zip
          retention-days: 30

  recette:
    name: Version de développement à la racine de la recette
    needs: hebergement
    # Un push sur `main`, ou le lancement manuel sur `main` : `main` se dépose à la racine de la
    # recette, jamais en production (#233). `apercu.sh` s'arrête avant tout transfert si un réglage de
    # recette manque ou vaut celui de la production, et laisse en place les aperçus (`pr-<numéro>`),
    # le `robots.txt` posé à la main et les paquets du relais. L'adresse de recette est un secret (#156) :
    # aucune sortie d'étape ni aucun commentaire ne la porte, le diagnostic reste dans ce journal. Une
    # version forcée, lancée sur `main`, ne la touche pas (#274).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.deploiement != 'ignorer' && !inputs.version_forcee
    runs-on: ubuntu-latest
    environment: depot-ftp
    # Un seul dépôt à la fois : deux transferts simultanés laisseraient le site à moitié à jour.
    concurrency:
      group: depot-recette-racine
      cancel-in-progress: false
    env:
      HOTE: ${{ secrets.OVH_FTP_HOST }}
      UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
      MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
      # Recette : aucune valeur par défaut (`apercu.sh`), comme pour les aperçus.
      TIRELIRE_DEV_FTP_DOSSIER: ${{ vars.TIRELIRE_DEV_FTP_DOSSIER }}
      TIRELIRE_DEV_SITE_URL: ${{ secrets.TIRELIRE_DEV_SITE_URL }}
      TIRELIRE_FTP_DOSSIER: ${{ vars.TIRELIRE_FTP_DOSSIER }}
      TIRELIRE_SITE_URL: ${{ vars.TIRELIRE_SITE_URL }}
      PROTOCOLE: ${{ vars.TIRELIRE_FTP_PROTOCOLE || 'ftps' }}
      VERIFIER_CERTIFICAT: ${{ vars.TIRELIRE_FTP_VERIFIER_CERTIFICAT || 'oui' }}
      NETTOYER: ${{ vars.TIRELIRE_FTP_NETTOYER || 'non' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: pret
        run: |
          if [ -n "$HOTE" ] && [ -n "$UTILISATEUR" ] && [ -n "$MOTDEPASSE" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"
            {
              echo "### Dépôt de la version de développement ignoré"
              echo
              echo "Les secrets \`OVH_FTP_HOST\`, \`OVH_FTP_USER\` et \`OVH_FTP_PASSWORD\` ne sont pas tous"
              echo "renseignés dans le dépôt. Le site reste téléchargeable dans l'artefact"
              echo "\`tirelire-hebergement\` de ce passage. Voir \`docs/hebergement-web.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Avant tout transfert : sans réglages de recette, rien ne se dépose. L'adresse n'en sort pas.
      - name: Réglages de la recette
        if: steps.pret.outputs.pret == 'oui'
        run: bash apps/hebergement/apercu.sh racine-reglages > /dev/null

      - name: Récupérer le site assemblé
        if: steps.pret.outputs.pret == 'oui'
        uses: actions/download-artifact@v4
        with:
          name: tirelire-hebergement
          path: ${{ runner.temp }}/archive

      - name: Ouvrir l'archive
        if: steps.pret.outputs.pret == 'oui'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q "$RUNNER_TEMP/archive/tirelire-hebergement.zip" -d "$RUNNER_TEMP/site"
          # Garde-fou : ni configuration locale du relais ni paquets de synchronisation dans ce qui part.
          rm -f "$RUNNER_TEMP/site/relais.config.php"
          rm -f "$RUNNER_TEMP/site/donnees/"*.jsonl
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/relais.php"
          test -f "$RUNNER_TEMP/site/.htaccess"

      - name: Installer lftp
        if: steps.pret.outputs.pret == 'oui'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déposer à la racine de la recette
        if: steps.pret.outputs.pret == 'oui'
        env:
          SOURCE: ${{ runner.temp }}/site
          BLANC: ${{ inputs.deploiement == 'essai-a-blanc' && '1' || '' }}
        run: bash apps/hebergement/apercu.sh racine-deposer

      # L'adresse se recalcule ici plutôt que de passer par une sortie d'étape : elle dérive d'un
      # secret, et reste dans ce job, sous les masques posés par apercu.sh (#156).
      - name: Vérifier la racine de la recette en ligne
        if: steps.pret.outputs.pret == 'oui' && inputs.deploiement != 'essai-a-blanc'
        run: |
          set -euo pipefail
          ADRESSE_SITE="$(bash apps/hebergement/apercu.sh racine-reglages | sed -n 's/^adresse=//p')"
          export ADRESSE_SITE
          bash apps/hebergement/verifier.sh

      - name: Résumé
        if: always() && steps.pret.outputs.pret == 'oui'
        run: |
          {
            echo "### Version de développement à la racine de la recette"
            echo
            if [ "${{ job.status }}" = success ]; then
              echo "- Mode : ${{ inputs.deploiement == 'essai-a-blanc' && 'essai à blanc (rien transféré)' || 'transfert réel, vérifié en ligne' }}"
              echo "- Anciens fichiers : $([ "$NETTOYER" = oui ] && echo supprimés || echo conservés)"
              echo "- Jamais touchés : les aperçus \`pr-<numéro>\`, \`robots.txt\`, \`donnees/*.jsonl\`, \`relais.config.php\`"
            else
              echo "Pas de version de développement à jour : le diagnostic est dans le journal de ce job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Le tag de la version (#274). Pour une version forcée, il ne se pose qu'après le seuil 3 vert
  # (`test`), sur le commit joué, avec le nom que `test` a trouvé libre, s'il l'est encore ; un tag
  # déjà là fait échouer la pose. Pour un tag poussé à la main, il est déjà là : le job le nomme. Le
  # dépôt en production, l'APK et la release l'attendent.
  etiquette:
    name: Étiquette de la version
    needs: test
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee)
    runs-on: ubuntu-latest
    permissions:
      contents: write # poser le tag d'une version forcée, par l'API
    outputs:
      nom: ${{ steps.poussee.outputs.nom || steps.posee.outputs.nom }}
    steps:
      - name: Tag poussé à la main
        id: poussee
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.version_forcee
        run: echo "nom=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: inputs.version_forcee
        with:
          fetch-depth: 0 # les tags, pour relire le nom
          persist-credentials: false
      - name: Version forcée, son nom relu
        id: relu
        if: inputs.version_forcee
        run: node packages/gardes/version-forcee.mjs nom
      # Le jeton du job pose le tag : aucun workflow ne se déclenche sur ce tag, rien ne se rejoue.
      - name: Poser le tag de la version forcée
        id: posee
        if: inputs.version_forcee
        env:
          GH_TOKEN: ${{ github.token }}
          NOM: ${{ steps.relu.outputs.nom }}
          ATTENDU: ${{ needs.test.outputs.version_forcee }}
        run: |
          set -euo pipefail
          if [ -z "$NOM" ] || [ "$NOM" != "$ATTENDU" ]; then
            echo "::error title=Version forcée refusée::le nom a changé pendant les tests (« $ATTENDU », puis « $NOM ») : une version a été publiée entre-temps ; rien ne se publie"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$NOM" -f sha="$GITHUB_SHA" > /dev/null
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "- Tag \`$NOM\` posé sur \`$GITHUB_SHA\`, après le seuil 3 vert." >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Dépôt FTP en production
    needs: [hebergement, etiquette]
    # À la publication d'une version seulement : le push de son tag `v*`, ou une version forcée (#274),
    # après les tests au seuil 3 (`test`, dont dépendent `hebergement` et `etiquette`) et le tag ;
    # jamais sur `main` ni au lancement manuel de ce workflow (#233, D83, D87).
    # L'environnement `depot-ftp` : dépôt privé sur l'offre gratuite, déclaré sans effet (#176) ; s'il
    # reprend effet (dépôt public, #155), il doit admettre les tags `v*`.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.version_forcee
    runs-on: ubuntu-latest
    environment: depot-ftp
    # Un seul dépôt à la fois : deux transferts simultanés laisseraient le site à moitié à jour.
    concurrency:
      group: deploiement-ftp
      cancel-in-progress: false
    env:
      HOTE: ${{ secrets.OVH_FTP_HOST }}
      UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
      MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
      # Variables de dépôt (Settings → Secrets and variables → Actions → Variables), toutes facultatives :
      DOSSIER: ${{ vars.TIRELIRE_FTP_DOSSIER || 'www' }}
      PROTOCOLE: ${{ vars.TIRELIRE_FTP_PROTOCOLE || 'ftps' }}
      VERIFIER_CERTIFICAT: ${{ vars.TIRELIRE_FTP_VERIFIER_CERTIFICAT || 'oui' }}
      NETTOYER: ${{ vars.TIRELIRE_FTP_NETTOYER || 'non' }}
      # Adresse publique du site, vérifiée après chaque dépôt. La variable fait foi : aucune adresse
      # de repli ; sans elle, le résumé dit que le site n'est pas vérifié en ligne.
      ADRESSE_SITE: ${{ vars.TIRELIRE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: pret
        run: |
          if [ -n "$HOTE" ] && [ -n "$UTILISATEUR" ] && [ -n "$MOTDEPASSE" ]; then
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          else
            echo "pret=non" >> "$GITHUB_OUTPUT"
            {
              echo "### Dépôt FTP ignoré"
              echo
              echo "Les secrets \`OVH_FTP_HOST\`, \`OVH_FTP_USER\` et \`OVH_FTP_PASSWORD\` ne sont pas tous"
              echo "renseignés dans le dépôt. Le site reste téléchargeable dans l'artefact"
              echo "\`tirelire-hebergement\` de ce passage (\`tirelire-hebergement.zip\`, gardé 30 jours),"
              echo "déposé par le job « Site pour hébergement mutualisé », et joint à la release du tag."
              echo "Voir \`docs/hebergement-web.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Récupérer le site assemblé
        if: steps.pret.outputs.pret == 'oui'
        uses: actions/download-artifact@v4
        with:
          name: tirelire-hebergement
          path: ${{ runner.temp }}/archive

      - name: Ouvrir l'archive
        if: steps.pret.outputs.pret == 'oui'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q "$RUNNER_TEMP/archive/tirelire-hebergement.zip" -d "$RUNNER_TEMP/site"
          # Garde-fou : ni configuration locale du relais ni paquets de synchronisation dans ce qui part.
          rm -f "$RUNNER_TEMP/site/relais.config.php"
          rm -f "$RUNNER_TEMP/site/donnees/"*.jsonl
          test -f "$RUNNER_TEMP/site/index.html"
          test -f "$RUNNER_TEMP/site/relais.php"
          test -f "$RUNNER_TEMP/site/.htaccess"

      - name: Installer lftp
        if: steps.pret.outputs.pret == 'oui'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Transférer
        if: steps.pret.outputs.pret == 'oui'
        env:
          SOURCE: ${{ runner.temp }}/site
        run: |
          set -o pipefail
          bash apps/hebergement/deposer.sh 2>&1 | tee "$RUNNER_TEMP/depot.log"

      - name: En cas d'échec, publier la fin du journal en commentaire du commit
        if: failure() && steps.pret.outputs.pret == 'oui'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # L'utilisateur et l'adresse du serveur sont masqués : un commentaire de commit se lit
          # partout où le dépôt se lit. La redaction passe par python pour ne dépendre d'aucun
          # caractère particulier dans les secrets.
          python3 - <<'PY' > "$RUNNER_TEMP/commentaire.md"
          import os
          chemin = os.path.join(os.environ["RUNNER_TEMP"], "depot.log")
          journal = open(chemin, encoding="utf-8", errors="replace").read() if os.path.exists(chemin) else "(journal absent)"
          for secret, remplacement in (("UTILISATEUR", "«utilisateur»"), ("HOTE", "«serveur»"), ("MOTDEPASSE", "«mot de passe»")):
              valeur = os.environ.get(secret)
              if valeur:
                  journal = journal.replace(valeur, remplacement)
          lignes = journal.splitlines()[-60:]
          print(f"Le dépôt sur l'hébergement a échoué (run {os.environ['GITHUB_RUN_NUMBER']}). Fin du journal :")
          print()
          print("```")
          print("\n".join(lignes))
          print("```")
          if "certificate" in journal.lower():
              print()
              print("Le certificat du serveur FTP n'est pas accepté. Si l'hébergeur présente un certificat")
              print("qui ne correspond pas au nom du serveur, mettre la variable")
              print("`TIRELIRE_FTP_VERIFIER_CERTIFICAT` à `non`, ou passer en `sftp`.")
          PY
          cat "$RUNNER_TEMP/commentaire.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat "$RUNNER_TEMP/commentaire.md")" > /dev/null

      - name: Vérifier le site en ligne
        id: verification
        if: steps.pret.outputs.pret == 'oui' && env.ADRESSE_SITE != ''
        run: |
          set -o pipefail
          bash apps/hebergement/verifier.sh 2>&1 | tee "$RUNNER_TEMP/verification.log"

      - name: En cas d'échec, publier le diagnostic en commentaire du commit
        if: failure() && steps.verification.conclusion == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # L'adresse du site n'est pas un secret : le diagnostic se lit tel quel, y compris
          # depuis un téléphone, dans les commentaires du commit.
          {
            echo "Le site a été déposé, mais ne répond pas comme attendu (run $GITHUB_RUN_NUMBER) :"
            echo
            echo '```'
            cat "$RUNNER_TEMP/verification.log"
            echo '```'
          } > "$RUNNER_TEMP/diagnostic.md"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body=@"$RUNNER_TEMP/diagnostic.md"

      - name: Résumé
        if: steps.pret.outputs.pret == 'oui'
        run: |
          {
            echo "### Version publiée, déposée en production"
            echo
            echo "- Protocole : \`$PROTOCOLE\` vers \`$HOTE\`, dossier \`$DOSSIER\`"
            echo "- Anciens fichiers : $([ "$NETTOYER" = oui ] && echo supprimés || echo conservés)"
            echo "- Jamais touchés : \`donnees/*.jsonl\`, \`relais.config.php\`"
            if [ -n "$ADRESSE_SITE" ]; then
              echo "- Vérifié en ligne : $ADRESSE_SITE"
            else
              echo "- **Pas vérifié en ligne** : le transfert a réussi, mais rien n'a encore confirmé que"
              echo "  l'hébergement sert bien le site. Renseigner la variable \`TIRELIRE_SITE_URL\`"
              echo "  (adresse publique, sous-dossier compris) pour que la CI teste l'accueil, la"
              echo "  réécriture \`/r/<salon>\` et la protection du dossier \`donnees/\` après chaque dépôt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  assemblage-apercu:
    name: Assemblage de l'aperçu de la PR
    needs: test
    # Au passage en Ready seulement, après ses tests : jamais sur un brouillon. La version de dev est
    # celle du dernier commit de la branche (#141, #150). Aucun identifiant FTP, aucun réglage de
    # recette, lecture seule : le dépôt se fait dans `depot-apercu.yml`, lu sur `main`, qui reprend
    # l'artefact quand le porteur coche la case de l'aperçu (#155, #175).
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # La version de la branche, telle que la PR la montre : son dernier commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le seul assemblage du site sur une PR (#153).
      - name: Assembler pour le sous-dossier de l'aperçu
        env:
          TIRELIRE_BASE: /pr-${{ github.event.pull_request.number }}/
          TIRELIRE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: pnpm --filter @tirelire/hebergement assembler
      - uses: actions/upload-artifact@v4
        with:
          name: apercu-pr-${{ github.event.pull_request.number }}
          path: apps/hebergement/tirelire-hebergement.zip
          if-no-files-found: error
          # `depot-apercu.yml` le reprend, case cochée, si toute la CI de la PR a fini verte (#169, #175).
          retention-days: 7

  android:
    name: APK Android
    needs: [test, etiquette]
    # Le job le plus lourd : seulement à un tag, poussé ou posé pour une version forcée après le seuil 3
    # vert (#274), plus à chaque fusion.
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Le nom d'une version forcée, que l'application affiche (#142) ; vide ailleurs.
          TIRELIRE_VERSION: ${{ needs.test.outputs.version_forcee }}
      - name: Synchroniser les fichiers web dans le projet Android
        working-directory: apps/web
        run: npx cap sync android

      - name: Numéro de version
        id: version
        env:
          VERSION_FORCEE: ${{ needs.test.outputs.version_forcee }}
        run: |
          BASE=$(node -p "require('./apps/web/package.json').version")
          if [ -n "$VERSION_FORCEE" ]; then
            echo "name=${VERSION_FORCEE#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${BASE}-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Clé de signature (secrets si présents, sinon clé de test)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "custom=true" >> "$GITHUB_OUTPUT"
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'APK
        working-directory: apps/web/android
        env:
          TIRELIRE_VERSION_CODE: ${{ steps.version.outputs.code }}
          TIRELIRE_VERSION_NAME: ${{ steps.version.outputs.name }}
          TIRELIRE_KEYSTORE_FILE: ${{ steps.keystore.outputs.custom == 'true' && steps.keystore.outputs.file || '' }}
          TIRELIRE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIRELIRE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TIRELIRE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Les variables vides sont retirées pour laisser jouer les valeurs par défaut (clé de test).
          for v in TIRELIRE_KEYSTORE_FILE TIRELIRE_KEYSTORE_PASSWORD TIRELIRE_KEY_ALIAS TIRELIRE_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tirelire-${TIRELIRE_VERSION_NAME}.apk"
          echo "APK=$RUNNER_TEMP/tirelire-${TIRELIRE_VERSION_NAME}.apk" >> "$GITHUB_ENV"

      # La release ne l'attend pas (#289) : elle sort avec le ZIP d'hébergement, et ce résumé le dit.
      - name: En cas d'échec, dire que la release sort sans APK
        if: failure()
        run: |
          {
            echo "### Release publiée sans APK"
            echo
            echo "La construction de l'APK a échoué : la release de cette version porte \`tirelire-hebergement.zip\` (job « Publication des releases »), sans APK. La cause est dans le journal de ce job (« APK Android »)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: En cas d'échec, publier la fin du journal Gradle en commentaire du commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "La construction de l'APK a échoué (run ${GITHUB_RUN_NUMBER}). Fin du journal Gradle :"
            echo
            echo '```'
            grep -vE '^\s*at |^\s*\.\.\. [0-9]+ more' "$RUNNER_TEMP/gradle.log" | tail -n 120
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: tirelire-apk
          path: ${{ env.APK }}
          retention-days: 30

  # La release porte le ZIP d'hébergement dès que le site est assemblé et le tag posé : elle n'attend pas
  # `android`, dont l'échec ne doit pas la retenir (#289). L'APK vient après, dans `apk-de-la-release`.
  publication:
    name: Publication des releases
    needs: [hebergement, etiquette]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le site pour hébergement
        uses: actions/download-artifact@v4
        with:
          name: tirelire-hebergement
          path: ${{ runner.temp }}/publication

      # Le titre se lit dans le nom du tag, comme celui de l'APK : il ne dépend pas d'`android`.
      - name: Titre de la release
        id: titre
        env:
          TAG: ${{ needs.etiquette.outputs.nom }}
        run: echo "nom=Tirelire ${TAG#v}" >> "$GITHUB_OUTPUT"

      # Si la release du tag existe déjà, créée à la main dans GitHub, l'action la met à jour et y
      # téléverse le fichier, au lieu d'en créer une autre.
      - name: Release taguée
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee
        uses: softprops/action-gh-release@v2
        with:
          # Le tag poussé, ou celui de la version forcée, posé par `etiquette` (#274).
          tag_name: ${{ needs.etiquette.outputs.nom }}
          name: ${{ steps.titre.outputs.nom }}
          generate_release_notes: true
          files: ${{ runner.temp }}/publication/tirelire-hebergement.zip

  # Le job n'existe que si `android` a construit l'APK : sans lui, la release reste telle que
  # `publication` l'a publiée, et le résumé d'`android` le dit (#289). Ni le titre ni les notes de la
  # release ne sont redonnés : l'action garde ceux de la release que `publication` vient de publier.
  apk-de-la-release:
    name: APK joint à la release
    needs: [etiquette, android, publication]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version_forcee
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l'APK
        uses: actions/download-artifact@v4
        with:
          name: tirelire-apk
          path: ${{ runner.temp }}/publication

      - name: Joindre l'APK à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.etiquette.outputs.nom }}
          files: ${{ runner.temp }}/publication/tirelire-${{ needs.android.outputs.version }}.apk
