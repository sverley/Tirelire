name: CI et livraison

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests et build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Archiver le site (à déposer tel quel sur un serveur privé)
        uses: actions/upload-artifact@v4
        with:
          name: tirelire-web
          path: apps/web/dist
          retention-days: 30

  hebergement:
    name: Site pour hébergement mutualisé
    needs: test
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assembler (PWA + relais PHP + .htaccess + .ovhconfig)
        env:
          # Sous-dossier où le site sera installé (« / » par défaut = racine du domaine ou sous-domaine).
          TIRELIRE_BASE: ${{ vars.TIRELIRE_BASE || '/' }}
        run: pnpm --filter @tirelire/hebergement assembler
      - uses: actions/upload-artifact@v4
        with:
          name: tirelire-hebergement
          path: apps/hebergement/tirelire-hebergement.zip
          retention-days: 30
      - name: Déposer par FTP sur l'hébergement (seulement si les secrets OVH_FTP_* existent)
        if: github.event_name != 'pull_request' && env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_HOST }}
          username: ${{ secrets.OVH_FTP_USER }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: apps/hebergement/dist/
          server-dir: ${{ secrets.OVH_FTP_DIR || 'www/' }}
          # Ne jamais toucher aux paquets de synchronisation ni à la configuration locale du relais.
          exclude: |
            donnees/**
            relais.config.php

  android:
    name: APK Android
    needs: [test, hebergement]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Synchroniser les fichiers web dans le projet Android
        working-directory: apps/web
        run: npx cap sync android

      - name: Numéro de version
        id: version
        run: |
          BASE=$(node -p "require('./apps/web/package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${BASE}-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Clé de signature (secrets si présents, sinon clé de test)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "custom=true" >> "$GITHUB_OUTPUT"
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire l'APK
        working-directory: apps/web/android
        env:
          TIRELIRE_VERSION_CODE: ${{ steps.version.outputs.code }}
          TIRELIRE_VERSION_NAME: ${{ steps.version.outputs.name }}
          TIRELIRE_KEYSTORE_FILE: ${{ steps.keystore.outputs.custom == 'true' && steps.keystore.outputs.file || '' }}
          TIRELIRE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIRELIRE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TIRELIRE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Les variables vides sont retirées pour laisser jouer les valeurs par défaut (clé de test).
          for v in TIRELIRE_KEYSTORE_FILE TIRELIRE_KEYSTORE_PASSWORD TIRELIRE_KEY_ALIAS TIRELIRE_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tirelire-${TIRELIRE_VERSION_NAME}.apk"
          echo "APK=$RUNNER_TEMP/tirelire-${TIRELIRE_VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - name: En cas d'échec, publier la fin du journal Gradle en commentaire du commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "La construction de l'APK a échoué (run ${GITHUB_RUN_NUMBER}). Fin du journal Gradle :"
            echo
            echo '```'
            grep -vE '^\s*at |^\s*\.\.\. [0-9]+ more' "$RUNNER_TEMP/gradle.log" | tail -n 120
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: tirelire-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Récupérer l'archive pour hébergement
        uses: actions/download-artifact@v4
        with:
          name: tirelire-hebergement
          path: ${{ runner.temp }}

      - name: Déplacer le tag « latest » sur ce commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest
          cp "$APK" "$RUNNER_TEMP/tirelire-latest.apk"

      - name: Version de test « latest » (à chaque push sur main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version de test (${{ steps.version.outputs.name }})
          body: |
            Version de test construite automatiquement depuis `main` (${{ github.sha }}).
            Signée avec la clé de test : les mises à jour s'installent par-dessus la précédente.
            Fichier : `tirelire-latest.apk` (toujours le plus récent).
            `tirelire-hebergement.zip` : le site à déposer sur un hébergement web mutualisé (voir `docs/hebergement-web.md`).
          prerelease: true
          files: |
            ${{ runner.temp }}/tirelire-latest.apk
            ${{ runner.temp }}/tirelire-hebergement.zip

      - name: Release taguée
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Tirelire ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ env.APK }}
            ${{ runner.temp }}/tirelire-hebergement.zip
