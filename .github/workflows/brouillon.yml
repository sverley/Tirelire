name: Retour en brouillon

# Le passage en Ready est la validation du porteur ; tout changement ensuite l'annule (#150, B6). Un
# commit, une édition (description, titre, base), un commentaire, une revue ou un commentaire de revue
# sur une PR prête, de qui que ce soit, porteur compris, ou une édition, un commentaire ou le retrait
# de l'étiquette « en validation » sur l'issue qu'elle ferme : la PR repasse en brouillon, l'étiquette
# quitte l'issue, et un commentaire sur la PR dit pourquoi. Rien d'autre ne tourne : le prochain
# passage en Ready rejoue tout. Au retour en brouillon fait à la main, et à la fermeture de la PR,
# fusionnée ou non, l'étiquette quitte seulement l'issue.
#
# Place du job sur le second axe des harnais (#113) :
# - `brouillon` est hors harnais : il ne vérifie rien, il change l'état de la PR et de l'issue.
#
# Sur un brouillon, sur une issue sans l'étiquette, le job est écarté par sa condition : rien ne
# tourne. Une étiquette, une assignation ou une demande de revue ne sont pas des changements : ces
# événements ne sont pas écoutés. GitHub lit ce workflow sur `main` pour `pull_request_target`,
# `issue_comment` et `issues`, si bien qu'une PR ne peut pas retirer le sien ; pour les revues, il le
# lit dans la PR, faute d'équivalent. Ce que fait le jeton du job — conversion, étiquette,
# commentaire, posté en dernier — ne déclenche aucun workflow : il ne se renvoie jamais lui-même.

on:
  pull_request_target:
    types: [synchronize, edited, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [edited, unlabeled]

permissions: {}

# Les changements d'une même PR ou d'une même issue, l'un après l'autre.
concurrency:
  group: brouillon-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  brouillon:
    name: Retour en brouillon
    if: >-
      (github.event.pull_request && (github.event.pull_request.draft != true || github.event.action == 'converted_to_draft' || github.event.action == 'closed'))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.draft != true)
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'en validation'))
      || (github.event_name == 'issues' && github.event.action == 'edited' && contains(github.event.issue.labels.*.name, 'en validation'))
      || (github.event_name == 'issues' && github.event.action == 'unlabeled' && github.event.label.name == 'en validation')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENEMENT: ${{ github.event_name }}
      ACTION: ${{ github.event.action }}
      AUTEUR: ${{ github.actor }}
      PR: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
      ISSUE: ${{ (!github.event.issue.pull_request && github.event.issue.number) || '' }}
      ETIQUETTE: en validation
      # Mots par lesquels une PR ferme une issue, comme les lit la garde (`issuesFermees`).
      FERMETURE: '\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#([0-9]+)\b'
    steps:
      - name: Renvoyer la PR en brouillon, ou retirer l'étiquette
        run: |
          set -euo pipefail
          retirer_etiquette() {
            if gh issue view "$1" --json labels --jq '.labels[].name' | grep -qxF "$ETIQUETTE"; then
              gh issue edit "$1" --remove-label "$ETIQUETTE"
              echo "Étiquette « $ETIQUETTE » retirée de l'issue #$1."
            fi
          }
          issues_de_pr() {
            gh pr view "$1" --json body | jq -r --arg m "$FERMETURE" '[(.body // "") | scan($m; "i")[0]] | unique[]'
          }
          prs_pretes_de_issue() {
            gh pr list --state open --limit 200 --json number,isDraft,body \
              | jq -r --arg m "$FERMETURE" --arg n "$1" '.[] | select(.isDraft | not) | select([(.body // "") | scan($m; "i")[0]] | any(. == $n)) | .number'
          }
          renvoyer() { # $1 : la PR ; $2 : la cause
            etat=$(gh pr view "$1" --json isDraft,state --jq 'if .state == "OPEN" and (.isDraft | not) then "prête" else "autre" end')
            if [ "$etat" != prête ]; then
              echo "PR #$1 déjà en brouillon ou fermée : rien à faire."
              return 0
            fi
            gh pr ready "$1" --undo
            for n in $(issues_de_pr "$1"); do retirer_etiquette "$n"; done
            gh pr comment "$1" --body "Repassée en brouillon : $2 (par $AUTEUR). L'analyse du besoin a pu changer : la validation donnée au passage en Ready ne vaut plus. Le prochain passage en Ready rejouera toute la CI."
            echo "PR #$1 repassée en brouillon : $2."
          }
          pour_l_issue() { # $1 : la cause
            for p in $(prs_pretes_de_issue "$ISSUE"); do renvoyer "$p" "$1"; done
            retirer_etiquette "$ISSUE"
          }
          fait() { # accord du participe avec l'action
            case "$ACTION" in
              created) echo "écrit" ;; edited) echo "modifié$1" ;; deleted) echo "supprimé" ;;
              submitted) echo "soumise" ;; dismissed) echo "écartée" ;; *) echo "$ACTION" ;;
            esac
          }
          case "$EVENEMENT:$ACTION" in
            pull_request_target:converted_to_draft | pull_request_target:closed)
              for n in $(issues_de_pr "$PR"); do retirer_etiquette "$n"; done ;;
            pull_request_target:synchronize) renvoyer "$PR" "un commit a été poussé" ;;
            pull_request_target:edited) renvoyer "$PR" "sa description, son titre ou sa base ont été modifiés" ;;
            pull_request_review:*) renvoyer "$PR" "une revue a été $(fait e)" ;;
            pull_request_review_comment:*) renvoyer "$PR" "un commentaire de revue a été $(fait '')" ;;
            issue_comment:*)
              if [ -n "$PR" ]; then renvoyer "$PR" "un commentaire a été $(fait '')"
              else pour_l_issue "un commentaire a été $(fait '') sur l'issue #$ISSUE"; fi ;;
            issues:edited) pour_l_issue "l'issue #$ISSUE a été modifiée" ;;
            issues:unlabeled) pour_l_issue "l'étiquette « $ETIQUETTE » a été retirée de l'issue #$ISSUE" ;;
          esac
