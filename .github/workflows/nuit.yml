name: Tests navigateur de la nuit

# Chaque nuit, vers 3 h UTC (#307, #348) : les tests navigateur de non-régression
# (`apps/web/test/navigateur/`) se jouent sur le dernier commit de `main`, au seuil 2, sauf chaque
# fichier vert sur son empreinte. Ils ne se jouent plus ni avant la fusion ni à la CI d'une fusion sur
# `main` (`ci.yml`) : ils ne décident d'aucune fusion. `main` ne part qu'en recette ; la production ne
# se dépose qu'au tag d'une version, ou d'une version forcée, qui rejoue tout au seuil 3, tests
# navigateur compris, sans rien sauter (D83).
#
# Ce qu'une nuit trouve vert vaut pour les nuits suivantes, tant que ce qu'il lit ne change pas :
# l'attestation de la nuit vit sur la branche `attestation-de-la-nuit`, écrite par l'outillage
# (`.githooks/attestation.mjs nuit`, `bilan`, `envoyer`). Une nuit où rien de ce qu'ils lisent n'a
# changé ne joue rien, et le dit dans le résumé de l'exécution.
#
# Une nuit rouge se signale sans qu'on la cherche (`packages/gardes/nuit.mjs`) : une issue s'ouvre, ou
# se complète si celle d'une nuit précédente est encore ouverte ; elle nomme les fichiers rouges et le
# commit de `main` jugé. La nuit verte qui suit le dit dans cette issue. Une nuit qui devait jouer
# et qui échoue avant de savoir ce qu'elle joue — extraction, outil de la nuit — est une nuit rouge :
# elle se signale de même, sans fichier rouge à nommer ; sans le dépôt extrait, par `gh`.
#
# L'heure : un seul déclenchement planifié, à 3 h 00 UTC, toute l'année (#348) ; aucun fuseau
# n'entre en compte. Le lancement manuel, sur `main`, joue toujours.
#
# Place des jobs sur le second axe des harnais (#113) :
# - `navigateur` lit des fichiers suivis : il joue les tests navigateur sur `main`, en mode strict
#   (`TIRELIRE_STRICT`, un outil manquant fait échouer le job) ; il écrit l'attestation de la nuit sur
#   sa branche et signale une nuit rouge par une issue, par l'API.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions: {}

# Une nuit à la fois ; une nuit en cours ne s'annule pas.
concurrency:
  group: nuit
  cancel-in-progress: false

jobs:
  navigateur:
    name: Tests navigateur sur main
    runs-on: ubuntu-latest
    permissions:
      contents: write # l'attestation de la nuit, sur sa branche
      issues: write # la nuit rouge, signalée
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ce que les nuits précédentes ont trouvé vert ; rien ne s'installe si rien ne se joue.
      - name: Ce que la nuit a déjà trouvé vert
        id: plan
        run: |
          NUIT=$RUNNER_TEMP/nuit
          echo "NUIT=$NUIT" >> "$GITHUB_ENV"
          node .githooks/attestation.mjs nuit "$NUIT" "$GITHUB_STEP_SUMMARY"
          echo "jouer=$(cat "$NUIT/jouer")" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4 # version lue dans package.json (packageManager)
        if: steps.plan.outputs.jouer == 'oui'
      - if: steps.plan.outputs.jouer == 'oui'
        run: pnpm install --frozen-lockfile
      # Au seuil 2, sauf chaque fichier vert sur son empreinte (`--attestation`) ; le lanceur dit les
      # fichiers qu'il joue et ceux qu'il saute. L'image GitHub fournit Chrome.
      - name: Tests navigateur au seuil 2, sauf empreinte verte
        id: tests
        if: steps.plan.outputs.jouer == 'oui'
        env:
          TIRELIRE_STRICT: '1'
        run: |
          mkdir -p "$NUIT/journaux"
          printf 'navigateur\tnavigateur\tvitest\n' > "$NUIT/journaux/lances"
          set +e
          (cd apps/web && pnpm run test 2 --navigateur --attestation "$NUIT/couverture.json" --bilan "$NUIT/journaux/navigateur.bilan" --reporter=default --reporter=json --outputFile.json="$NUIT/journaux/navigateur.rapport" test/navigateur) 2>&1 | tee "$NUIT/journaux/navigateur.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$NUIT/journaux/navigateur.code"
          exit "$code"
      # Ce qu'elle a trouvé vert — tout l'ensemble, ou ses fichiers un à un — vaut pour les nuits
      # suivantes : l'attestation part sur `attestation-de-la-nuit`, même rouge.
      - name: Bilan et attestation de la nuit
        if: always() && steps.plan.outputs.jouer == 'oui' && steps.tests.outcome != 'skipped'
        env:
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          {
            echo "### Bilan de la nuit"
            echo
            node .githooks/attestation.mjs bilan "$NUIT/plan" "$NUIT/journaux" "la nuit" "$(git rev-parse HEAD^{tree})" "$COMMIT" nuit "$NUIT/verts.json" --enregistrer | sed 's/^/- /'
            node .githooks/attestation.mjs envoyer origin nuit attestation-de-la-nuit | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Une nuit rouge se signale
        # Sauf quand le plan dit que rien ne se joue : un plan qui a échoué ne dit rien, et la nuit est
        # alors rouge (#307, point 8).
        if: always() && steps.plan.outputs.jouer != 'non'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Sans plan, le commit que le déclenchement visait.
          COMMIT: ${{ steps.plan.outputs.commit || github.sha }}
          RESULTAT: ${{ steps.tests.outcome }}
          EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une nuit qui n'a pas pu jouer (installation rouge, plan rouge, par exemple) est une nuit rouge.
          verdict=rouge
          [ "$RESULTAT" = success ] && verdict=vert
          if [ -f packages/gardes/nuit.mjs ] && command -v node > /dev/null; then
            node packages/gardes/nuit.mjs signaler "$verdict" "$COMMIT" "${NUIT:-$RUNNER_TEMP/nuit}/journaux/navigateur.rapport" "$EXECUTION"
            exit
          fi
          # Sans le dépôt extrait, ni l'outil de la nuit : la même issue, par `gh` — même titre, même
          # marque que `packages/gardes/nuit.mjs`.
          titre='Tests navigateur rouges la nuit, sur main'
          texte="<!-- nuit : rouge -->
          Nuit rouge : la nuit n'a pas pu jouer les tests navigateur sur le commit \`$COMMIT\` de \`main\` — elle a échoué avant de savoir ce qu'elle joue (extraction, outil de la nuit). Aucun fichier rouge à nommer : voir le journal de l'exécution.

          Exécution : $EXECUTION"
          numero=$(gh issue list --state open --limit 100 --json number,title,body --jq "[.[] | select(.title == \"$titre\" and (.body | contains(\"<!-- nuit : tests navigateur -->\")))] | sort_by(.number) | .[0].number // empty")
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body "$texte"
          else
            gh issue create --title "$titre" --body "<!-- nuit : tests navigateur -->
          $texte"
          fi
