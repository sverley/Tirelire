name: Retrait du pied Claude Code

# Le proxy des sessions ajoute à chaque description et commentaire qu'elles écrivent par l'API un
# pied : un trait `---`, puis « _Generated by [Claude Code](…)_ ». Ce pied disparaît (#254) :
# - à la fusion d'une PR, de sa description, de ses commentaires et de ses revues, et de la
#   description et des commentaires de chaque issue qu'elle ferme (« Close #n ») ; une PR fermée
#   sans fusion n'est pas nettoyée, et un brouillon ne se fusionne pas : rien ne tourne sur lui ;
# - une fois par semaine, de toutes les issues et PR, ouvertes ou fermées.
# Seul le pied change ; un texte sans pied n'est pas réécrit (`packages/gardes/retirer-pied.mjs`).
#
# GitHub lit ce workflow sur `main` (`pull_request_target`, `schedule`) ; le job extrait `main`, rien
# de la PR, et n'appelle que l'API. Ce que fait le jeton du job ne déclenche aucun workflow : un
# nettoyage ne se signale pas comme un changement (`suivi.yml`).
#
# Place du job sur le second axe des harnais (#113) :
# - `retrait` est hors harnais : il ne vérifie rien ; il rougit s'il ne parvient pas à réécrire un
#   texte.

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

concurrency:
  group: nettoyage-${{ github.event.pull_request.number || 'semaine' }}
  cancel-in-progress: false

jobs:
  retrait:
    name: Retrait du pied Claude Code
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: packages/gardes
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retirer le pied de la PR fusionnée et des issues qu'elle ferme
        if: github.event_name == 'pull_request_target'
        run: node packages/gardes/retirer-pied.mjs fusion "$PR"
      - name: Retirer le pied de tout le projet
        if: github.event_name == 'schedule'
        run: node packages/gardes/retirer-pied.mjs tout
