name: Étiquette de l'issue au Ready

# Au passage en Ready d'une PR (#150) : l'étiquette « en validation » sur l'issue qu'elle ferme dit à
# `brouillon.yml`, sans lancer de job, qu'une modification de cette issue annule la validation. Lu sur
# `main` (`pull_request_target`) ; à part de `validation.yml`, où la garde tourne seule, en lecture.
#
# Place du job sur le second axe des harnais (#113, D71) :
# - `etiquette` est hors harnais : il ne vérifie rien ; il rougit s'il ne parvient pas à poser
#   l'étiquette. Ce que fait le jeton du job ne déclenche aucun workflow.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: etiquette-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  etiquette:
    name: Étiquette de l'issue
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMERO: ${{ github.event.pull_request.number }}
      ETIQUETTE: en validation
      # Mots par lesquels une PR ferme une issue, comme les lit la garde (`issuesFermees`).
      FERMETURE: '\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#([0-9]+)\b'
    steps:
      - name: Poser l'étiquette sur l'issue que la PR ferme
        run: |
          set -euo pipefail
          issues=$(gh pr view "$NUMERO" --json body | jq -r --arg m "$FERMETURE" '[(.body // "") | scan($m; "i")[0]] | unique[]')
          if [ -z "$issues" ]; then
            echo "::error title=Étiquette « en validation »::La PR #$NUMERO ne cite aucune issue par « Close #n »."
            exit 1
          fi
          for n in $issues; do
            gh issue edit "$n" --add-label "$ETIQUETTE"
            echo "Étiquette « $ETIQUETTE » posée sur l'issue #$n."
          done
