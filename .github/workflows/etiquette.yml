name: Étiquettes de l'issue

# À la fermeture d'une issue, par la fusion d'une PR ou à la main : l'étiquette « en cours » la
# quitte (#157), pour que la liste des issues « en cours » dise ce qui l'est.
#
# Au passage en Ready d'une PR (#150) : l'étiquette « en validation » sur l'issue qu'elle ferme dit à
# `brouillon.yml`, sans lancer de job, qu'une modification de cette issue annule la validation. Lu sur
# `main` (`pull_request_target`) ; à part de `validation.yml`, où la garde tourne seule, en lecture.
#
# Place du job sur le second axe des harnais (#113, D71) :
# - `etiquette` et `fin` sont hors harnais : ils ne vérifient rien ; ils rougissent s'ils ne
#   parviennent pas à poser ou retirer l'étiquette. Ce que fait le jeton d'un job ne déclenche aucun
#   workflow : le retrait de « en cours » ne réveille pas `brouillon.yml`.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [closed]

permissions: {}

concurrency:
  group: etiquette-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  etiquette:
    name: Étiquette de l'issue
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMERO: ${{ github.event.pull_request.number }}
      ETIQUETTE: en validation
      # Mots par lesquels une PR ferme une issue, comme les lit la garde (`issuesFermees`).
      FERMETURE: '\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#([0-9]+)\b'
    steps:
      - name: Poser l'étiquette sur l'issue que la PR ferme
        run: |
          set -euo pipefail
          issues=$(gh pr view "$NUMERO" --json body | jq -r --arg m "$FERMETURE" '[(.body // "") | scan($m; "i")[0]] | unique[]')
          if [ -z "$issues" ]; then
            echo "::error title=Étiquette « en validation »::La PR #$NUMERO ne cite aucune issue par « Close #n »."
            exit 1
          fi
          for n in $issues; do
            gh issue edit "$n" --add-label "$ETIQUETTE"
            echo "Étiquette « $ETIQUETTE » posée sur l'issue #$n."
          done

  fin:
    name: Fin de l'issue
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'en cours')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMERO: ${{ github.event.issue.number }}
    steps:
      - name: Retirer « en cours » de l'issue fermée
        run: |
          gh issue edit "$NUMERO" --remove-label "en cours"
          echo "Étiquette « en cours » retirée de l'issue #$NUMERO."
