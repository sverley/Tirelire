name: Aperçu

# Attente du vert de toute la CI au Ready, et retrait de l'aperçu d'une PR (#141, #155). Sur
# `pull_request_target`, GitHub lit ce workflow sur `main`, jamais dans la PR : une PR ne peut ni le
# réécrire, ni changer les scripts de dépôt qu'il lance. Les identifiants FTP (`OVH_FTP_*`) : dépôt
# public, dans l'environnement `depot-ftp`, qui n'admet que `main` (#155) ; dépôt privé sur l'offre
# gratuite, au niveau du dépôt, lisibles par un workflow qu'une branche ajoute (#176, risque accepté).
#
# Rien de la PR ne s'exécute ici ; ne vient de `main` que `apercu.sh`, donc le bornage à
# `<dossier>/pr-<numéro>`.
#
# Le Ready ne dépose rien (#175) : le dépôt est une action du porteur, qui coche la case de l'aperçu
# dans la description de la PR (`depot-apercu.yml`), et n'a lieu qu'au vert de toute la CI (#169).
# Au Ready, le job `attente` attend toute la CI — `ci.yml` (tests, build, assemblage) et
# `validation.yml` (la garde) — pour le dernier commit de la branche ; si l'une rougit, `raison` le dit
# en commentaire de la PR, avec le lien de l'exécution en cause. Le job `statut` termine le statut
# « Toute la CI sur ce commit » (#168). Le porteur coche la case au vert, regarde l'aperçu déposé, puis
# fusionne : la fusion vaut validation.
#
# Place de chaque job sur le second axe des harnais, ce qu'ils lisent (#113) :
# - `attente` est hors harnais : il attend la fin de toute la CI de la PR et ne fait que lire leurs
#   conclusions, en lecture seule, sans secret ni code de la PR.
# - `statut` est hors harnais : il reporte sur le commit le verdict d'`attente`, sans rien vérifier.
# - `raison` est hors harnais : quand `attente` a vu une CI rouge, il le dit en commentaire de la PR.
# - `retrait` est hors harnais : à la fermeture de la PR, il supprime son sous-dossier de recette
#   (`apercu.sh retirer`), sans tests ni build (#131).

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

permissions: {}

# Un nouveau passage en Ready rend caduque l'attente d'avant, jamais un retrait.
concurrency:
  group: apercu-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  attente:
    name: Attente du vert de toute la CI
    # Au passage en Ready seulement : jamais sur un brouillon, ni à la fermeture.
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read # les exécutions de la CI sur la tête de la PR, et l'artefact
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      run: ${{ steps.ci.outputs.run }}
      message: ${{ steps.ci.outputs.message }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMERO: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Toute la CI de ce passage en Ready, sur le dernier commit de la branche : les exécutions créées
      # au plus tôt deux minutes avant celle-ci. Chacune doit finir verte ; une seule rouge, annulée ou
      # absente dans l'heure, et la case de l'aperçu ne déposera rien.
      - name: Attendre la fin de toute la CI
        id: ci
        run: |
          set -euo pipefail
          echo "sha=$SHA" >> "$GITHUB_OUTPUT" # le commit attendu, que `statut` termine
          cree="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          depuis="$(date -u -d "$cree - 2 minutes" +%Y-%m-%dT%H:%M:%SZ)"
          # Fichier et événement de chaque workflow de la CI d'une PR.
          ci="ci.yml:pull_request validation.yml:pull_request_target"
          dernier() { # $1 : fichier, $2 : événement → « id statut conclusion nom|lien »
            gh api "repos/$GH_REPO/actions/workflows/$1/runs?event=$2&head_sha=$SHA&per_page=20" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$depuis\")] | sort_by(.created_at) | last // empty | \"\(.id) \(.status) \(.conclusion // \"-\") \(.name)|\(.html_url)\""
          }
          fin=$((SECONDS + 3600))
          while :; do
            finies=0; rouges=""; run=""
            for w in $ci; do
              etat="$(dernier "${w%%:*}" "${w#*:}")"
              [ -z "$etat" ] && continue
              read -r id statut conclusion reste <<< "$etat"
              [ "$statut" = completed ] || continue
              finies=$((finies + 1))
              [ "${w%%:*}" = ci.yml ] && run="$id"
              [ "$conclusion" = success ] || rouges+="- « ${reste%%|*} » : $conclusion — ${reste#*|}"$'\n'
            done
            [ -n "$rouges" ] && break
            [ "$finies" -eq 2 ] && break
            if [ "$SECONDS" -ge "$fin" ]; then
              rouges="- la CI n'a pas fini dans l'heure"$'\n'
              break
            fi
            sleep 30
          done
          if [ -z "$rouges" ] && ! gh api "repos/$GH_REPO/actions/runs/$run/artifacts" --jq '.artifacts[].name' | grep -qxF "apercu-pr-$NUMERO"; then
            rouges="- « CI et livraison » a fini sans laisser le site assemblé (apercu-pr-$NUMERO)"$'\n'
          fi
          if [ -n "$rouges" ]; then
            message="Toute la CI n'est pas verte sur ${SHA::7} : la case de l'aperçu n'y déposera rien."$'\n\n'"$rouges"
            printf '### Aperçu de la PR #%s\n\n%s' "$NUMERO" "$message" >> "$GITHUB_STEP_SUMMARY"
            { echo "message<<FIN_DU_MESSAGE"; echo "$message"; echo "FIN_DU_MESSAGE"; } >> "$GITHUB_OUTPUT"
            echo "::error title=CI pas verte::La CI de la PR n'est pas toute verte ; voir le commentaire de la PR."
            exit 1
          fi
          echo "Toute la CI est verte ; site assemblé par l'exécution $run de ci.yml."
          echo "run=$run" >> "$GITHUB_OUTPUT"

  raison:
    name: Pourquoi la CI n'est pas verte
    # Seulement quand `attente` a vu une CI rouge : le commentaire nomme le workflow en cause. Un job à
    # part, pour que l'attente reste en lecture seule.
    needs: attente
    if: failure() && needs.attente.outputs.message != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NUMERO: ${{ github.event.pull_request.number }}
      MESSAGE: ${{ needs.attente.outputs.message }}
    steps:
      - run: gh pr comment "$NUMERO" --body "$MESSAGE"

  statut:
    name: Statut de toute la CI
    # Termine le statut « Toute la CI sur ce commit », mis en attente au Ready par `pret.yml` (#168) :
    # vert si `attente` a vu toute la CI verte, rouge sinon. Il se lit à côté du bouton de fusion. Un
    # job à part, pour que l'attente reste en lecture seule.
    needs: attente
    if: >-
      always() && github.event_name == 'pull_request_target' && github.event.action != 'closed'
      && github.event.pull_request.draft != true && needs.attente.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.attente.outputs.sha }}
      RESULTAT: ${{ needs.attente.result }}
      CONTEXTE: Toute la CI sur ce commit
    steps:
      - run: |
          if [ "$RESULTAT" = success ]; then etat=success; d="Toute la CI est verte sur ce commit"
          else etat=failure; d="La CI n'est pas toute verte sur ce commit : voir le commentaire de la PR"; fi
          gh api "repos/$GH_REPO/statuses/$SHA" -f state="$etat" -f context="$CONTEXTE" -f description="$d" > /dev/null

  retrait:
    name: Retrait de l'aperçu de la PR
    # À la fermeture seulement (fusion ou abandon) : ni tests ni build (#131).
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: depot-ftp
    permissions:
      contents: read
    env:
      NUMERO: ${{ github.event.pull_request.number }}
      TIRELIRE_DEV_FTP_DOSSIER: ${{ vars.TIRELIRE_DEV_FTP_DOSSIER }}
      TIRELIRE_DEV_SITE_URL: ${{ vars.TIRELIRE_DEV_SITE_URL }}
      TIRELIRE_FTP_DOSSIER: ${{ vars.TIRELIRE_FTP_DOSSIER }}
      TIRELIRE_SITE_URL: ${{ vars.TIRELIRE_SITE_URL }}
      PROTOCOLE: ${{ vars.TIRELIRE_FTP_PROTOCOLE || 'ftps' }}
      VERIFIER_CERTIFICAT: ${{ vars.TIRELIRE_FTP_VERIFIER_CERTIFICAT || 'oui' }}
    steps:
      # Rien de la branche : seul le bornage de `main` décide de ce qui se supprime (#155).
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: apps/hebergement
          persist-credentials: false
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Retirer l'aperçu
        env:
          HOTE: ${{ secrets.OVH_FTP_HOST }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
          MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
        run: bash apps/hebergement/apercu.sh retirer
