name: Aperçu

# Dépôt et retrait de l'aperçu d'une PR sur l'instance de recette (#141, #155). Sur
# `pull_request_target`, GitHub lit ce workflow sur `main`, jamais dans la PR : une PR ne peut ni le
# réécrire, ni changer les scripts de dépôt qu'il lance. Les identifiants FTP (`OVH_FTP_*`) vivent
# dans l'environnement `depot-ftp`, qui n'admet que `main` : un run de `pull_request`, dont le
# workflow vient de la branche, ne peut pas les obtenir, quoi que la PR modifie.
#
# Rien de la PR ne s'exécute ici. Son site est assemblé par `ci.yml` (job « Assemblage de l'aperçu
# de la PR », sans identifiants, après ses tests) et arrive en artefact ; ne viennent de `main` que
# `apercu.sh`, `deposer.sh` et `verifier.sh`, donc le bornage à `<dossier>/pr-<numéro>`.
#
# Dépôt manuel : au passage en Ready, le job `feu-vert` attend l'approbation du porteur sur
# l'environnement `apercu` (réviseur requis, `main` seulement, sans secret). La PR affiche alors le
# bouton « Review deployments » ; « Approve and deploy » lance le dépôt, « Reject » l'écarte. Un
# nouveau passage en Ready annule l'attente précédente. Le retrait à la fermeture reste automatique.
#
# Place de chaque job sur le second axe des harnais, ce qu'ils lisent (#113, D71) :
# - `feu-vert` est hors harnais : il ne fait qu'attendre l'approbation manuelle du dépôt.
# - `depot` lit hors des fichiers suivis : l'étape « Vérifier l'aperçu en ligne » (`verifier.sh`) lit
#   l'aperçu déployé et le commit qu'il sert (#141).
# - `retrait` est hors harnais : à la fermeture de la PR, il supprime son sous-dossier de recette
#   (`apercu.sh retirer`), sans tests ni build (#131).

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

permissions: {}

# Dépôt et retrait d'un même aperçu, l'un après l'autre ; un nouveau passage en Ready rend caduc le
# dépôt d'avant, jamais un retrait.
concurrency:
  group: apercu-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  feu-vert:
    name: Déployer l'aperçu ?
    # Au passage en Ready seulement ; attend « Approve and deploy » sur l'environnement `apercu`.
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    environment: apercu
    permissions: {}
    steps:
      - run: echo "Dépôt de l'aperçu de la PR #${{ github.event.pull_request.number }} approuvé."

  depot:
    name: Aperçu de la PR sur l'instance de recette
    needs: feu-vert
    # Au passage en Ready seulement (#150) : jamais sur un brouillon, ni à la fermeture.
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    environment: depot-ftp
    permissions:
      actions: read # l'exécution de `ci.yml` sur la tête de la PR, et son artefact
      contents: read
    env:
      NUMERO: ${{ github.event.pull_request.number }}
      # Recette : aucune valeur par défaut, apercu.sh arrête tout si l'une manque ou vaut la production.
      TIRELIRE_DEV_FTP_DOSSIER: ${{ vars.TIRELIRE_DEV_FTP_DOSSIER }}
      TIRELIRE_DEV_SITE_URL: ${{ vars.TIRELIRE_DEV_SITE_URL }}
      TIRELIRE_FTP_DOSSIER: ${{ vars.TIRELIRE_FTP_DOSSIER }}
      TIRELIRE_SITE_URL: ${{ vars.TIRELIRE_SITE_URL }}
      PROTOCOLE: ${{ vars.TIRELIRE_FTP_PROTOCOLE || 'ftps' }}
      VERIFIER_CERTIFICAT: ${{ vars.TIRELIRE_FTP_VERIFIER_CERTIFICAT || 'oui' }}
    steps:
      # Les scripts de dépôt de `main`, jamais ceux de la branche (#155).
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: apps/hebergement
          persist-credentials: false
      # Avant d'attendre quoi que ce soit : sans réglages de recette, rien ne se dépose.
      - name: Réglages de l'aperçu
        id: reglages
        run: bash apps/hebergement/apercu.sh reglages >> "$GITHUB_OUTPUT"
      # L'artefact `apercu-pr-<numéro>` que `ci.yml` dépose pour ce même passage en Ready : le plus
      # récent, créé au plus tôt deux minutes avant cette exécution. Si l'exécution de `ci.yml` pour
      # cette PR finit sans lui (tests rouges), pas d'aperçu, comme avant.
      - name: Attendre l'assemblage de la PR
        id: assemblage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cree="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          depuis="$(date -u -d "$cree - 2 minutes" +%Y-%m-%dT%H:%M:%SZ)"
          artefact() {
            gh api "repos/$GH_REPO/actions/artifacts?name=apercu-pr-$NUMERO&per_page=30" \
              --jq "[.artifacts[] | select(.created_at >= \"$depuis\" and .expired == false)] | sort_by(.created_at) | last // empty | .workflow_run.id"
          }
          tests() {
            gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=pull_request&per_page=30" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$depuis\" and any(.pull_requests[]; .number == $NUMERO))] | sort_by(.created_at) | last // empty | \"\\(.status) \\(.conclusion)\""
          }
          fin=$((SECONDS + 3600))
          until run="$(artefact)" && [ -n "$run" ]; do
            etat="$(tests)"
            if [[ "$etat" == completed* ]]; then
              run="$(artefact)"
              [ -n "$run" ] && break
              echo "Pas d'aperçu : l'exécution de ci.yml pour la PR #$NUMERO a fini (« ${etat#completed } ») sans assembler le site." >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$fin" ]; then
              echo "Pas d'aperçu : aucun site assemblé pour la PR #$NUMERO dans l'heure." >&2
              exit 1
            fi
            sleep 20
          done
          echo "Site de la PR assemblé par l'exécution $run de ci.yml."
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Récupérer le site assemblé
        uses: actions/download-artifact@v4
        with:
          name: apercu-pr-${{ github.event.pull_request.number }}
          run-id: ${{ steps.assemblage.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archive
      # Ce qui vient de la PR n'est que des données : on le vérifie avant de le confier au dépôt.
      - name: Ouvrir l'archive
        id: archive
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          unzip -q "$RUNNER_TEMP/archive/tirelire-hebergement.zip" -d "$site"
          # Rien que des fichiers et des dossiers : un lien symbolique ferait téléverser ce qu'il
          # désigne sur cette machine, identifiants compris.
          intrus="$(find "$site" ! -type f ! -type d -print -quit)"
          if [ -n "$intrus" ]; then
            echo "Pas d'aperçu : l'archive contient autre chose qu'un fichier ou un dossier (${intrus#"$site"/})." >&2
            exit 1
          fi
          # Garde-fou, comme en production : ni configuration locale du relais ni paquets.
          rm -f "$site/relais.config.php"
          rm -f "$site/donnees/"*.jsonl
          test -f "$site/index.html"
          test -f "$site/relais.php"
          test -f "$site/.htaccess"
          # Le commit que porte la page assemblée (#141) : celui que l'aperçu en ligne doit servir.
          commit="$(sed -n 's/.*<meta name="tirelire-commit" content="\([0-9a-f]\{7,64\}\)".*/\1/p' "$site/index.html" | head -n 1)"
          if [ -z "$commit" ]; then
            echo "Pas d'aperçu : la page assemblée ne dit pas quel commit elle porte." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Déposer l'aperçu
        env:
          SOURCE: ${{ runner.temp }}/site
          HOTE: ${{ secrets.OVH_FTP_HOST }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
          MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
        run: bash apps/hebergement/apercu.sh deposer
      # Le diagnostic reste dans ce journal : aucun commentaire, l'adresse de recette ne s'affiche
      # pas en clair dans le dépôt.
      - name: Vérifier l'aperçu en ligne
        env:
          ADRESSE_SITE: ${{ steps.reglages.outputs.adresse }}
          COMMIT_ATTENDU: ${{ steps.archive.outputs.commit }}
        run: bash apps/hebergement/verifier.sh
      - name: Résumé
        if: always()
        env:
          COMMIT: ${{ steps.archive.outputs.commit }}
        run: |
          {
            echo "### Aperçu de la PR #$NUMERO"
            echo
            if [ "${{ job.status }}" = success ]; then
              echo "Déposé dans le sous-dossier \`pr-$NUMERO\` de la recette avec les scripts de \`main\`, et vérifié en ligne : il sert le commit \`${COMMIT::7}\`."
            else
              echo "Pas d'aperçu à jour : le diagnostic est dans le journal de ce job."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  retrait:
    name: Retrait de l'aperçu de la PR
    # À la fermeture seulement (fusion ou abandon) : ni tests ni build (#131).
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: depot-ftp
    permissions:
      contents: read
    env:
      NUMERO: ${{ github.event.pull_request.number }}
      TIRELIRE_DEV_FTP_DOSSIER: ${{ vars.TIRELIRE_DEV_FTP_DOSSIER }}
      TIRELIRE_DEV_SITE_URL: ${{ vars.TIRELIRE_DEV_SITE_URL }}
      TIRELIRE_FTP_DOSSIER: ${{ vars.TIRELIRE_FTP_DOSSIER }}
      TIRELIRE_SITE_URL: ${{ vars.TIRELIRE_SITE_URL }}
      PROTOCOLE: ${{ vars.TIRELIRE_FTP_PROTOCOLE || 'ftps' }}
      VERIFIER_CERTIFICAT: ${{ vars.TIRELIRE_FTP_VERIFIER_CERTIFICAT || 'oui' }}
    steps:
      # Rien de la branche : seul le bornage de `main` décide de ce qui se supprime (#155).
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: apps/hebergement
          persist-credentials: false
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Retirer l'aperçu
        env:
          HOTE: ${{ secrets.OVH_FTP_HOST }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USER }}
          MOTDEPASSE: ${{ secrets.OVH_FTP_PASSWORD }}
        run: bash apps/hebergement/apercu.sh retirer
